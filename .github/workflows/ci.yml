name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    # The plugin itself supports PHP 8.0+, but the dev toolchain (Pest 2, PHPStan extensions)
    # needs PHP 8.2+. Older versions get a syntax check of the shipped code only.
    name: Syntax PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: find billto-woocommerce.php uninstall.php includes -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Syntax check
        run: find billto-woocommerce.php uninstall.php includes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Coding standards (security subset)
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  build-zip:
    name: Distribution ZIP
    runs-on: ubuntu-latest
    needs: [syntax, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build/billto-woocommerce
          rsync -a --exclude-from=.distignore ./ build/billto-woocommerce/
          cd build && zip -rq billto-woocommerce.zip billto-woocommerce
      - uses: actions/upload-artifact@v4
        with:
          name: billto-woocommerce
          path: build/billto-woocommerce.zip
